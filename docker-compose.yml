name: dota-oracle

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dota_oracle}
      POSTGRES_USER: ${POSTGRES_USER:-dota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dota}
    ports:
      # Host side only. Inside the compose network the services always talk on the stock
      # ports; these are moved off the defaults because 5432/6379/8000 are commonly taken.
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dota}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6389}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${API_PORT:-8100}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      # Migrations are authored inside the container (Python 3.12 + asyncpg live there)
      # but must land on the host, in the repo.
      - ./alembic:/app/alembic
      # Tests are mounted so the DB-backed ones can be run inside the container, where
      # Python 3.12 and asyncpg live.
      - ./tests:/app/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Phase 4 training. Not started by `docker compose up` - it is a job a human runs and
  # watches, not a service:
  #     docker compose run --rm trainer python -m app.ml.cli train
  trainer:
    profiles: ["ml"]
    build:
      context: .
      target: ml
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MODEL_DIR: /app/models
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      # Trained boosters and their model cards land on the host, next to the repo.
      - ./models:/app/models

  worker:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: arq app.workers.settings.WorkerSettings

volumes:
  pgdata:
  redisdata:
