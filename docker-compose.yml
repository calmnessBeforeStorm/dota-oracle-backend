name: dota-oracle

# Development. Everything that has to keep running, and nothing that a person wants to
# restart by hand.
#
# The API and the SPA are deliberately absent: they are the two things being changed all day,
# and watching a reloader inside a container is strictly worse than watching it in the
# terminal that owns it. Run them yourself:
#
#     uvicorn app.main:app --reload --port 8100
#     cd ../dota-oracle-frontend && npm run dev
#
# Production is a different file and a different image - see docker-compose.prod.yml, where
# the SPA is built into the same image that serves the API.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dota_oracle}
      POSTGRES_USER: ${POSTGRES_USER:-dota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dota}
    ports:
      # Host side only. Inside the compose network the services always talk on the stock
      # ports; these are moved off the defaults because 5432/6379/8000 are commonly taken.
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dota}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6389}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Everything the API image can do apart from serving requests: the test suite, ruff, mypy,
  # alembic and the ingestion CLI. Not a running service - `docker compose run` starts it for
  # one command and throws it away:
  #
  #     docker compose run --rm tools python -m pytest
  #     docker compose run --rm tools python -m app.ingestion.cli status
  #     docker compose run --rm tools alembic revision --autogenerate -m "..."
  #
  # It exists because those jobs need Python 3.12, asyncpg and a reachable Postgres, and the
  # container is where all three are certain to be. Removing the api service would otherwise
  # have taken the test runner with it.
  tools:
    profiles: ["tools"]
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      # Migrations are authored in here and must land on the host, in the repo.
      - ./alembic:/app/alembic
      - ./tests:/app/tests
      - ./models:/app/models
    command: sleep infinity

  # Phase 4 training. Not started by `docker compose up` - it is a job a human runs and
  # watches, not a service:
  #     docker compose run --rm trainer python -m app.ml.cli train
  trainer:
    profiles: ["ml"]
    build:
      context: .
      target: ml
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MODEL_DIR: /app/models
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      # Trained boosters and their model cards land on the host, next to the repo.
      - ./models:/app/models

  worker:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      # The poller is a serving path, not a training one: it calls `get_predictor()` on every
      # tick. Without this the container has no /app/models at all, so `ACTIVE_MODEL_VERSION`
      # resolves to a file that is not there and the worker quietly serves the baseline while
      # the API - started from the host, where ./models does exist - serves the real model.
      # Two different models answering as one version is worse than either.
      #
      # Read-only: a trained artifact is written by the trainer and by nothing else.
      - ./models:/app/models:ro
    command: arq app.workers.settings.WorkerSettings
    # Not the image's healthcheck. That one curls the API's /api/health, which this process
    # does not serve, so the container reported `unhealthy` from the second it started and
    # kept reporting it - a red light that is always red tells you nothing and hides the
    # real one. arq keeps its own liveness record in Redis with a TTL of
    # `health_check_interval + 1`, so `--check` fails within a minute of the event loop
    # dying and passes only while it is actually turning.
    healthcheck:
      test: ["CMD", "arq", "app.workers.settings.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
  redisdata:
