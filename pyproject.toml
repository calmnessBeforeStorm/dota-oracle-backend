[project]
name = "dota-oracle-backend"
version = "0.1.0"
description = "Live win-probability service for Tier 1 Dota 2 matches"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
    "httpx>=0.28",
    "tenacity>=9.0",
    "arq>=0.26",
    "structlog>=24.4",
    "orjson>=3.10",
    # Player ratings with uncertainty (spec section 6.2). Small, pure Python; the sigma is
    # a feature, which is why Elo is not enough.
    "trueskill>=0.4.5",
    # Inference, not training. This was in the `ml` extra on the reasoning that a request
    # server has no business carrying a training stack - true of scikit-learn and optuna, and
    # wrong about the booster itself: loading a trained model *is* the serving path. With it
    # only in the extra, no image that answers a request could read the artifact, so
    # ACTIVE_MODEL_VERSION resolved to a load failure and the process fell back to the
    # baseline. Measured 2026-09-01 on the live worker: `model.load_failed: No module named
    # 'lightgbm'` - the promotion path had never been run end to end.
    "lightgbm>=4.5",
]

[project.optional-dependencies]
# Training only. LightGBM is deliberately absent: it moved to the runtime dependencies,
# because serving a trained model needs it and serving is not training.
ml = [
    "polars>=1.17",
    "numpy>=2.1",
    "scikit-learn>=1.6",
    "optuna>=4.1",
    "mlflow>=2.19",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    # Pinned exactly, not floored. A formatter is the one tool where a version bump breaks
    # the build with no code change: 0.16.5 started formatting Python inside Markdown and
    # failed CI on a design document written under 0.16.4. Bump deliberately, not by
    # whatever PyPI serves on the day.
    "ruff==0.16.5",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Neither of these is source, and reformatting either is churn that breaks CI without a
# code change.
#   alembic/versions - written by autogenerate, not by hand.
#   docs             - specs and plans. Ruff 0.16.5 began formatting Python blocks inside
#                      Markdown, which turned a committed design document into a CI failure.
extend-exclude = ["alembic/versions", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
