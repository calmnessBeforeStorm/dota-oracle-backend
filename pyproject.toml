[project]
name = "dota-oracle-backend"
version = "0.1.0"
description = "Live win-probability service for Tier 1 Dota 2 matches"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
    "httpx>=0.28",
    "tenacity>=9.0",
    "arq>=0.26",
    "structlog>=24.4",
    "orjson>=3.10",
]

[project.optional-dependencies]
ml = [
    "polars>=1.17",
    "numpy>=2.1",
    "scikit-learn>=1.6",
    "lightgbm>=4.5",
    "optuna>=4.1",
    "mlflow>=2.19",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Migration bodies are written by alembic autogenerate, not by hand. Reformatting them
# is churn, and every new autogenerated file would otherwise break CI.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
