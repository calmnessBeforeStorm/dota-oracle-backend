name: dota-oracle-prod

# Production. Images are pulled, never built here: they are built and published by GitHub
# Actions on push to `main`, so the server needs neither a toolchain nor a checkout of the
# frontend. Everything it needs lives in /opt/dota-oracle:
#
#     docker-compose.prod.yml   this file
#     Caddyfile                 the front door
#     .env                      secrets, chmod 600, never in git
#     deploy.sh                 pull, migrate, up
#     models/                   the trained booster and its card
#
# The API and the SPA are separate images now, which is what made building in CI possible at
# all - a job checks out one repository. That split reintroduces the risk the single image
# avoided: an SPA and an API drifting apart.
#
# `IMAGE_TAG` closes it for the normal case - both follow `main`, both move on every deploy.
# It cannot close it for a rollback, because the two repositories have different commit
# SHAs: there is no single number naming "this API and that SPA". So a rollback names both,
# via API_TAG and FRONTEND_TAG, and pretending otherwise would be the kind of tidy story
# that leaves someone deploying a mismatched pair at three in the morning.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Read by the Caddyfile. Kept out of the file itself so the repository never names the
      # host it serves.
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Losing this volume means re-issuing on every
      # restart, which is how people meet Let's Encrypt's rate limits.
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  frontend:
    image: ghcr.io/${IMAGE_OWNER:?set IMAGE_OWNER in .env}/dota-oracle-frontend:${FRONTEND_TAG:-${IMAGE_TAG:-main}}
    # No ports: nothing reaches it except Caddy, over the compose network.
    restart: unless-stopped

  api:
    image: ghcr.io/${IMAGE_OWNER:?set IMAGE_OWNER in .env}/dota-oracle-api:${API_TAG:-${IMAGE_TAG:-main}}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # APP_ENV, not ENV: the setting is `app_env`, so `ENV` was read by nobody and the
      # service reported "env": "local" while running in production.
      APP_ENV: production
    volumes:
      # Trained boosters are not in the image - they come out of a run somebody watched, not
      # out of a build - so both services that answer with a model mount them from the host.
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The same image with a different command. Sharing it is deliberate: the poller computes
  # features with the code the API serves predictions from, and two images could drift apart
  # between deploys - which is train/serve skew wearing a different hat (invariant 2).
  worker:
    image: ghcr.io/${IMAGE_OWNER:?set IMAGE_OWNER in .env}/dota-oracle-api:${API_TAG:-${IMAGE_TAG:-main}}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # APP_ENV, not ENV: the setting is `app_env`, so `ENV` was read by nobody and the
      # service reported "env": "local" while running in production.
      APP_ENV: production
    volumes:
      - ./models:/app/models:ro
    command: arq app.workers.settings.WorkerSettings
    # Not the image's healthcheck. That one curls /api/health, which this process does not
    # serve, so the container would report `unhealthy` from its first second and keep doing
    # it - a red light that is always red tells you nothing and hides the real one. arq keeps
    # a liveness record in Redis with a TTL of `health_check_interval + 1`, so `--check`
    # fails within a minute of the event loop dying and passes only while it is turning.
    healthcheck:
      test: ["CMD", "arq", "app.workers.settings.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dota_oracle}
      POSTGRES_USER: ${POSTGRES_USER:-dota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # No published port. The database is reachable only from the compose network; reaching it
    # from a laptop is what the SSH tunnel is for.
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Docker gives a container 64 MB of /dev/shm - measured, not assumed - and that is where
    # Postgres puts the dynamic shared memory a parallel query needs. shared_buffers is not
    # affected (it is anonymous mmap), but a parallel aggregate over the snapshot table is:
    # 400k rows today, ~2.6M once the detail backfill finishes. The failure mode is
    # "could not resize shared memory segment", mid-query, under load.
    shm_size: 512m
    # Tuned for the 8 GB box. The stock 128 MB of shared_buffers assumes a far smaller
    # machine, and it shows here: the snapshot table is ~400k rows today and heads for 2.6M
    # once the detail backfill finishes, so every aggregate would go to disk.
    #
    # effective_cache_size is not an allocation - it is what the planner assumes the OS is
    # caching, and setting it low is how a planner talks itself out of index scans.
    #
    # work_mem is per sort, not per connection, so the worst case is roughly
    # max_connections x work_mem on top of shared_buffers. 60 x 16 MB leaves room on 7.8 GB
    # alongside the 2 GB of buffers; raising either without the other moving is how a box
    # starts swapping under a query nobody thought was heavy.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=16MB
      # A compromise, not a measurement: 4.0 is written for spinning rust and stops the
      # planner using indexes it should, while 1.1 claims NVMe. This disk is SATA-backed.
      - -c
      - random_page_cost=1.5
      # The backfill writes in long bursts. With the default 1 GB the checkpointer runs
      # constantly during them, which is write amplification for no benefit.
      - -c
      - max_wal_size=2GB
      - -c
      - max_connections=60
      - -c
      - wal_compression=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dota}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Redis holds the live feed and the arq queue - both rebuildable, neither worth an
    # unbounded memory footprint on a box that also runs Postgres.
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --save 900 1
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
