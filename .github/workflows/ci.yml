name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dota_oracle
          POSTGRES_USER: dota
          POSTGRES_PASSWORD: dota
        ports:
          # Published on the same port the app settings default to, so no env override
          # is needed here. The stock 5432 is deliberately avoided project-wide.
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U dota"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Types
        run: mypy app

      - name: Tests
        run: pytest

      # Proves the migrations actually run, both ways. The DB-free drift checks in
      # tests/test_migrations.py cannot catch a migration that is simply broken SQL.
      - name: Migrations apply and roll back
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      # `--target base` on purpose. The Dockerfile ends with the `ml` stage (phase-4
      # training), and a bare `docker build .` builds the last stage - which would ship
      # LightGBM and scikit-learn in the image that serves requests.
      - name: Build image
        run: docker build --target base -t dota-oracle-backend:${{ github.sha }} .
