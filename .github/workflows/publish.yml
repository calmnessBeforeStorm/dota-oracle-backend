name: Publish

# Builds the API image and pushes it to ghcr, so the server pulls a finished artifact and
# needs no toolchain of its own.
#
# Only `main`. Production runs what is on main, and publishing from every branch would make
# `:main` a moving target that occasionally pointed at unreviewed work.
on:
  push:
    branches: [main]
  # For rebuilding a tag without an empty commit.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only write this job gets. It cannot push to the repository, only to the registry.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # `github.repository_owner` keeps its original capitalisation, and a registry
      # rejects that outright: "repository name must be lowercase". The build fails
      # before it pushes, so the symptom is no image at all rather than a wrong one.
      # `${VAR,,}` is bash's lowercase expansion.
      - name: Lowercase the owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Issued for this run and expires with it - no long-lived token in the repository
          # settings that would have to be rotated or could leak from them.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          # Two tags on the same build. `main` is what the server follows; the SHA is what a
          # rollback names, and it keeps pointing at this exact image after main has moved.
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dota-oracle-api:main
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dota-oracle-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Read by the API and shown nowhere public; it is here so an image can be traced
          # back to the commit that produced it without keeping a spreadsheet.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
