# Production front door: static SPA, with the API and the socket behind the same origin.
#
# Same origin is the point. The SPA then calls /api and /ws with no base URL compiled in and
# no CORS to configure, and the WebSocket inherits the page's scheme - wss on https without
# anything knowing about it.

upstream api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    # Uploads are not a thing here, but a prediction payload is small and a 1m default would
    # be a surprise waiting to happen.
    client_max_body_size 2m;

    # The SPA is a single HTML file plus hashed assets. Anything hashed can be cached
    # forever; index.html never can, or a deploy leaves browsers on the old bundle pointing
    # at the new API.
    location /assets/ {
        root /srv/spa;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The upgrade headers are what separate this from the block above, and leaving them off
    # is a silent failure: the socket never connects and a live match simply looks quiet
    # (spec section 8.1, and the reason the WS router is mounted at the root rather than
    # under /api).
    location /ws/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A live match can go a minute between updates and the server pings every five
        # seconds; a 60s default would still cut idle sockets during a draft.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Client-side routing: /match/123 is a route the server has never heard of, so every
    # unknown path falls back to the app shell rather than 404.
    location / {
        root /srv/spa;
        try_files $uri $uri/ /index.html;
    }
}
